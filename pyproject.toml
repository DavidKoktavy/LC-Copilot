[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lc-copilot"
version = "0.1.0"
description = "Grounded Talk2Document + Talk2Data agent for trade finance (letters of credit): LangGraph, FastAPI, MCP, hybrid RAG, eval harness."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "David Koktavý" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "langgraph>=0.4",
  "httpx>=0.27",
  "numpy>=1.26",
  "sqlglot>=25",
  "mcp>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
otel = [
  "opentelemetry-sdk>=1.25",
  "opentelemetry-exporter-otlp-proto-http>=1.25",
]

[project.scripts]
lc-copilot-mcp = "lc_copilot.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008", "B905", "E501", "SIM105"]

[tool.ruff.lint.per-file-ignores]
"tests/conftest.py" = ["E402"]
